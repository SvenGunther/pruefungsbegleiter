<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prüfungsbegleiter</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F7; --surface:#FFFFFF; --ink:#1B2230; --slate:#5A6577; --rule:#D8DEE6; --soft:#E9EDF2;
  --accent:#0F6F74; --accent-ink:#FFFFFF; --accent-soft:#DCEEEE; --warn:#9A5B00; --warn-soft:#FFF1D9; --bad:#A33A2E;
  --g1:#1F7A5C; --g2:#5E9B3D; --g3:#B39A1F; --g4:#D3832A; --g5:#C4532F; --g6:#8B2A3A;
  --radius-s:6px; --radius-m:10px;
  --font:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display:"Bricolage Grotesque", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161D; --surface:#1A2029; --ink:#E6EAF0; --slate:#9AA5B5; --rule:#2E3744; --soft:#232B36;
    --accent:#4FB3B8; --accent-ink:#0B1A1B; --accent-soft:#17393B; --warn:#F0B35A; --warn-soft:#3A2C14; --bad:#F08A7C;
    --g1:#3FAE87; --g2:#86C05F; --g3:#D9C04A; --g4:#EB9F4C; --g5:#E2765A; --g6:#C9566A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#12161D; --surface:#1A2029; --ink:#E6EAF0; --slate:#9AA5B5; --rule:#2E3744; --soft:#232B36;
  --accent:#4FB3B8; --accent-ink:#0B1A1B; --accent-soft:#17393B; --warn:#F0B35A; --warn-soft:#3A2C14; --bad:#F08A7C;
  --g1:#3FAE87; --g2:#86C05F; --g3:#D9C04A; --g4:#EB9F4C; --g5:#E2765A; --g6:#C9566A;
  color-scheme: dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding-bottom:92px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:.4em 0}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{background:var(--surface);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top-inner{max-width:1240px;margin:0 auto;padding:12px 20px 0;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-family:var(--display);font-weight:700;font-size:1.2rem;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--font);font-weight:400;font-size:.8rem;color:var(--slate);letter-spacing:0}
.cur{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cur select{max-width:280px}
.tabs{max-width:1240px;margin:0 auto;padding:6px 14px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;cursor:pointer;color:var(--slate);white-space:nowrap;font-weight:700}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{max-width:1240px;margin:0 auto;padding:22px 20px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.grid-half{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:960px){.grid2,.grid-half{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-m);padding:18px}
.panel + .panel{margin-top:18px}
.panel h2 + p,.panel h3 + p{color:var(--slate);font-size:.93rem}
.sticky{position:sticky;top:160px}
@media (max-width:960px){.sticky{position:static}}
.muted{color:var(--slate)}
.small{font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 14px;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.85rem;color:var(--slate)}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius-s);padding:8px 10px;color:var(--ink);width:100%}
textarea{min-height:90px;resize:vertical;line-height:1.45}
.btn{background:var(--surface);border:1px solid var(--rule);border-radius:var(--radius-s);padding:8px 13px;cursor:pointer;font-weight:700}
.btn:hover{border-color:var(--slate)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--slate)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 9px;font-size:.85rem}

/* phases */
.phases{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.phase{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.9rem;color:var(--slate)}
.phase[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.timer{font-family:var(--display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.timer-target{font-size:.85rem;color:var(--slate)}
.timer.over{color:var(--warn)}

/* note entry */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.85rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:700}
.val{display:inline-flex;border:1px solid var(--rule);border-radius:var(--radius-s);overflow:hidden}
.val button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:700;min-width:40px}
.val button[aria-pressed="true"][data-v="+"]{background:var(--g1);color:#fff}
.val button[aria-pressed="true"][data-v="o"]{background:var(--slate);color:#fff}
.val button[aria-pressed="true"][data-v="-"]{background:var(--g5);color:#fff}
.log{list-style:none;padding:0;margin:12px 0 0;max-height:440px;overflow:auto;border-top:1px solid var(--rule)}
.log li{display:grid;grid-template-columns:52px 22px 1fr auto;gap:8px;padding:8px 2px;border-bottom:1px solid var(--rule);align-items:start;font-size:.95rem}
.log time{color:var(--slate);font-variant-numeric:tabular-nums;font-size:.85rem;padding-top:2px}
.log .v{font-weight:700;text-align:center}
.log .v.p{color:var(--g1)} .log .v.m{color:var(--g5)} .log .v.o{color:var(--slate)}
.log .meta{display:block;font-size:.78rem;color:var(--slate)}
.log button{background:none;border:0;color:var(--slate);cursor:pointer;padding:0 4px}

.checks{list-style:none;padding:0;margin:8px 0 0}
.checks li{border-bottom:1px solid var(--rule)}
.checks label{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:8px 0;cursor:pointer;align-items:start}
.checks input{margin-top:4px;width:16px;height:16px;accent-color:var(--accent)}
.checks .hint{display:block;font-size:.8rem;color:var(--slate)}
.tri{display:inline-flex;gap:2px;margin-left:auto}
.checks li.tri-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0}
.tri button{border:1px solid var(--rule);background:var(--surface);border-radius:4px;padding:2px 8px;cursor:pointer;font-weight:700;font-size:.85rem}
.tri button[aria-pressed="true"][data-v="ja"]{background:var(--g1);color:#fff;border-color:var(--g1)}
.tri button[aria-pressed="true"][data-v="teils"]{background:var(--g3);color:#fff;border-color:var(--g3)}
.tri button[aria-pressed="true"][data-v="nein"]{background:var(--g5);color:#fff;border-color:var(--g5)}

/* indicators */
.area{margin-top:22px}
.area:first-child{margin-top:0}
.area-head{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.area-head .w{margin-left:auto;font-size:.85rem;color:var(--slate)}
.subgroup{font-size:.85rem;color:var(--slate);margin:14px 0 2px;font-weight:700}
.ind{padding:12px 0;border-bottom:1px solid var(--rule)}
.ind-head{display:flex;gap:10px;align-items:baseline}
.ind-name{font-weight:700}
.ind-pts{margin-left:auto;font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.seg{display:grid;grid-template-columns:repeat(6,1fr) 44px;gap:4px;margin:8px 0 6px}
.seg button{border:1px solid var(--rule);background:var(--paper);border-radius:var(--radius-s);padding:7px 0;cursor:pointer;font-weight:700;font-family:var(--display)}
.seg button.skip{font-family:var(--font);font-weight:400;color:var(--slate)}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent}
.seg button[data-g="1"][aria-pressed="true"]{background:var(--g1)}
.seg button[data-g="2"][aria-pressed="true"]{background:var(--g2)}
.seg button[data-g="3"][aria-pressed="true"]{background:var(--g3)}
.seg button[data-g="4"][aria-pressed="true"]{background:var(--g4)}
.seg button[data-g="5"][aria-pressed="true"]{background:var(--g5)}
.seg button[data-g="6"][aria-pressed="true"]{background:var(--g6)}
.desc{font-size:.92rem;color:var(--slate);min-height:1.4em}
.desc.on{color:var(--ink)}
.fine{display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--slate);margin-top:4px}
.fine input{flex:1;accent-color:var(--accent)}
.evid{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.evid span{font-size:.85rem;padding-left:10px;border-left:3px solid var(--rule)}
.evid span.p{border-left-color:var(--g1)} .evid span.m{border-left-color:var(--g5)}

/* result */
.big{font-family:var(--display);font-weight:700;font-size:3.4rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font-size:1rem;font-weight:500;letter-spacing:0;color:var(--slate)}
.gname{font-family:var(--display);font-size:1.4rem;font-weight:700}
.arealist{list-style:none;padding:0;margin:12px 0}
.arealist li{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--rule);font-size:.93rem}
.note{background:var(--warn-soft);color:var(--ink);border-left:4px solid var(--warn);padding:8px 10px;border-radius:4px;font-size:.88rem;margin-top:8px}
.note.info{background:var(--accent-soft);border-left-color:var(--accent)}
.props{display:grid;grid-template-columns:1fr 90px;gap:6px 10px;align-items:center;margin-top:10px}
.props label{font-size:.9rem}
.props .ord{font-family:var(--display);font-weight:700;color:var(--slate);margin-right:6px}

/* scale bar */
.scalebar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--rule);z-index:15;padding:10px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.scale-inner{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.scale-read{display:flex;align-items:baseline;gap:8px;min-width:170px}
.scale-read b{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.scale{position:relative;height:30px}
.bands{display:grid;grid-template-columns:2fr 3fr 3fr 3fr 3fr 2fr;height:12px;border-radius:999px;overflow:hidden;margin-top:4px;direction:rtl}
.bands span{display:block}
.bands span:nth-child(1){background:var(--g1)}.bands span:nth-child(2){background:var(--g2)}.bands span:nth-child(3){background:var(--g3)}
.bands span:nth-child(4){background:var(--g4)}.bands span:nth-child(5){background:var(--g5)}.bands span:nth-child(6){background:var(--g6)}
.blabels{display:grid;grid-template-columns:2fr 3fr 3fr 3fr 3fr 2fr;font-size:.7rem;color:var(--slate);margin-top:2px;direction:rtl;text-align:center}
.marker{position:absolute;top:-2px;width:4px;height:20px;background:var(--ink);border-radius:2px;transform:translateX(-50%);transition:left .35s ease}
.marker.cap{background:var(--warn)}
@media (prefers-reduced-motion:reduce){.marker{transition:none}}
@media (max-width:640px){.top{position:static}.scale-inner{grid-template-columns:1fr;gap:4px}.blabels{display:none}body{padding-bottom:104px}}

/* theory tracker */
.theories{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.th{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--rule);border-radius:var(--radius-s);padding:8px 10px;background:var(--paper)}
.th b{font-weight:700}
.th .k{display:block;font-size:.82rem;color:var(--slate)}
.stufe{display:inline-flex;gap:3px}
.stufe button{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:var(--surface);cursor:pointer;font-weight:700;font-size:.8rem}
.stufe button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.qlist{list-style:none;padding:0;margin:8px 0}
.qlist li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);align-items:start}
.steps{counter-reset:s;list-style:none;padding:0;margin:8px 0}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule)}
.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;color:var(--accent)}
.steps li.done{color:var(--slate);text-decoration:line-through}
.quote{border-left:3px solid var(--accent);padding:6px 12px;margin:8px 0;background:var(--paper);border-radius:0 4px 4px 0}
.quote b{display:block;font-size:.82rem;color:var(--slate);font-weight:700}

table.adj{width:100%;border-collapse:collapse;font-size:.85rem}
.tablewrap{overflow-x:auto}
table.adj th,table.adj td{border:1px solid var(--rule);padding:6px;vertical-align:top;text-align:left}
table.adj th{font-family:var(--display)}

.docs{list-style:none;padding:0;margin:10px 0}
.docs li{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:center}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--rule);border-radius:4px;padding:0 6px;color:var(--slate);margin-left:6px}
.out{white-space:pre-wrap;background:var(--paper);border:1px solid var(--rule);border-radius:var(--radius-s);padding:12px;font-size:.93rem;max-height:420px;overflow:auto}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 16px;border-radius:999px;font-size:.9rem;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
.status{font-size:.8rem;color:var(--slate)}
.empty{padding:22px;text-align:center;color:var(--slate);border:1px dashed var(--rule);border-radius:var(--radius-m)}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">Prüfungsbegleiter<small>Lehrproben und Staatsprüfungen im Thüringer Vorbereitungsdienst</small></div>
    <div class="cur">
      <label class="sr" for="curSel">Aktuelle Beobachtung</label>
      <select id="curSel"></select>
      <button class="btn sm" data-action="newObs" data-type="praktisch">Neue Lehrprobe</button>
      <button class="btn sm" data-action="newObs" data-type="muendlich">Neue mündliche Prüfung</button>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</header>
<main id="main"></main>
<div class="scalebar" aria-live="polite">
  <div class="scale-inner">
    <div class="scale-read" id="scaleRead"></div>
    <div>
      <div class="scale"><div class="bands"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div class="blabels"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span></div>
        <div class="marker" id="marker" style="left:0;display:none"></div></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="fileIn" class="sr" accept=".txt,.md,.json,.csv,.pdf,.html">
<input type="file" id="importIn" class="sr" accept=".json">

<script>
"use strict";
/* ============================================================
   GRUNDLAGEN: Notenstufen, Leistungsbilder, Handlungsfelder
   ============================================================ */
const GRADES = [
  {n:1, name:"sehr gut",     min:14, max:15, def:14, txt:"den Anforderungen in besonderem Maße entspricht"},
  {n:2, name:"gut",          min:11, max:13, def:12, txt:"den Anforderungen voll entspricht"},
  {n:3, name:"befriedigend", min:8,  max:10, def:9,  txt:"im Allgemeinen den Anforderungen entspricht"},
  {n:4, name:"ausreichend",  min:5,  max:7,  def:6,  txt:"zwar Mängel aufweist, aber im Ganzen den Anforderungen noch entspricht"},
  {n:5, name:"mangelhaft",   min:2,  max:4,  def:3,  txt:"den Anforderungen nicht entspricht, jedoch erkennen lässt, dass die notwendigen Grundkenntnisse vorhanden sind"},
  {n:6, name:"ungenügend",   min:0,  max:1,  def:1,  txt:"den Anforderungen nicht entspricht und selbst die Grundkenntnisse lückenhaft sind"}
];
const ADJ = {
  1:"vielschichtig, allumfassend, tiefgründig, nachhaltig, beispielhaft, überragend, herausragend, in besonderem Maße, optimal, zutreffend, korrekt, sicher, konsequent, souverän, flexibel, kompetent, kohärent, flüssig, logisch, vollständig, professionell, differenziert",
  2:"umfassend, überwiegend, vorwiegend, fundiert, zielgerichtet, schlüssig, gelungen, überzeugend, themengerecht",
  3:"angemessen, solide, weitgehend, im Wesentlichen, prinzipiell, grundsätzlich, mit Abstrichen/Einschränkungen, brauchbar, akzeptabel, zweckmäßig, tragfähig, praktikabel, bemüht",
  4:"im Ansatz, ansatzweise, oberflächlich, mit Hilfen, punktuell, mit erheblichen Abstrichen, partiell, teilweise, bedingt, hinreichend, erkennbar, nachvollziehbar",
  5:"lückenhaft, kaum, widersprüchlich, unzureichend, stockend, wenig",
  6:"nicht, fehlt, falsch, gravierende Mängel, konzeptionslos, keine, fehlerhaft, abwegig, diffus"
};
function gradeOf(p){ if(p==null||isNaN(p)) return null; const r=Math.round(p); return GRADES.find(g=>r>=g.min && r<=g.max) || GRADES[5]; }

const I = (id,group,name,subj,levels)=>({id,group,name,subj,levels});
const PROFILES = {
  praktisch:{ label:"Praktische Prüfung / Lehrprobe", areas:[
    {id:"planung", name:"Planung (Entwurf)", items:[
      I("P1","","Gesamtdarstellung","Der Entwurf",["wird stringent und logisch strukturiert","wird überwiegend stringent und schlüssig strukturiert","wird zweckmäßig strukturiert","wird erkennbar und nachvollziehbar strukturiert","wird kaum strukturiert","ist konzeptionslos"]),
      I("P2","","Formale Vorgaben, Aspekte, Kriterien","Formale Vorgaben, Aspekte und Kriterien",["werden vollständig und fehlerfrei eingehalten","werden überwiegend fehlerfrei eingehalten","werden im Wesentlichen eingehalten","werden mit erheblichen Einschränkungen eingehalten","werden kaum eingehalten","werden nicht eingehalten"]),
      I("P3","","Fachliche Korrektheit","Die fachliche Korrektheit",["wird vielschichtig (verdeutlichend differenziert) nachgewiesen","wird fundiert nachgewiesen","wird mit Abstrichen, aber zweckmäßig nachgewiesen","wird punktuell und oberflächlich nachgewiesen","wird kaum sinnvoll und lückenhaft nachgewiesen","wird nicht oder fehlerhaft nachgewiesen"]),
      I("P4","","Zielgruppenorientierte didaktische, fachdidaktische und pädagogische Konzepte und Methoden","Das Anwenden zielgruppenorientierter didaktischer, fachdidaktischer und pädagogischer Konzepte und Methoden",["wird vielschichtig und kompetent erörtert","wird umfassend und schlüssig erörtert","wird solide und zweckmäßig erörtert","wird oberflächlich, aber hinreichend erörtert","wird unzureichend erörtert","ist konzeptionslos"])

function touch(what,id){
  if(what==="obs"){ dirty.obs.add(id); if(S.obs[id]) S.obs[id].updated=Date.now(); }
  if(what==="kb"){ dirty.kb=true; S.kb.updated=Date.now(); }

async function flush(){
  lsSet();
  if(!S.db||!S.uid||saving) { setStatus(); return; }
  saving=true;
  const base="data/users/"+S.uid;
  try{
    for(const id of [...dirty.delObs]){ await S.db.doc(base+"/store/obs/"+id).delete(); dirty.delObs.delete(id); }
    for(const id of [...dirty.delDocs]){ await S.db.doc(base+"/store/kbdocs/"+id).delete(); dirty.delDocs.delete(id); }
    for(const id of [...dirty.obs]){ dirty.obs.delete(id); if(S.obs[id]) await S.db.doc(base+"/store/obs/"+id).set(JSON.parse(JSON.stringify(S.obs[id]))); }
    for(const id of [...dirty.docs]){ dirty.docs.delete(id); if(S.docs[id]) await S.db.doc(base+"/store/kbdocs/"+id).set(S.docs[id]); }
    if(dirty.kb){ dirty.kb=false; await S.db.doc(base+"/kb").set(JSON.parse(JSON.stringify(S.kb))); }
    S.store="Datenbank (privat)";
  }catch(e){ S.store="lokal (Datenbank nicht erreichbar)"; console.warn(e); }
  saving=false; setStatus();
  if(dirty.obs.size||dirty.docs.size||dirty.kb) { clearTimeout(saveT); saveT=setTimeout(flush,900); }
}

      docSnap.docs.forEach(d=>{ S.docs[d.id]=JSON.parse(JSON.stringify(d.data())); });

function profileOf(o){
  const base=PROFILES[o.type];
  const areas=base.areas.map(a=>({...a, items:[...a.items]}));
  (S.kb.indicators||[]).filter(x=>x.profile===o.type).forEach(x=>{
    const a=areas.find(a=>a.id===x.area); if(a) a.items.push({id:x.id,group:"Eigene Ergänzung",name:x.name,subj:x.subj||x.name,levels:x.levels,custom:true});
  });
  return {label:base.label, areas};
}
function weightsOf(type){ return Object.assign({}, DEFAULT_WEIGHTS[type], (S.kb.weights||{})[type]||{}); }
function compute(o){
  const prof=profileOf(o), w=weightsOf(o.type);
  let sum=0, sw=0, rated=0, total=0; const areas=[]; const all=[];
  prof.areas.forEach(a=>{
    const r=a.items.filter(i=>o.ratings[i.id]!=null);
    total+=a.items.length; rated+=r.length;
    r.forEach(i=>all.push({item:i, area:a, p:o.ratings[i.id]}));
    if(r.length){ const m=r.reduce((s,i)=>s+o.ratings[i.id],0)/r.length; areas.push({a, mean:m, n:r.length, w:w[a.id]||0}); if(w[a.id]){ sum+=m*w[a.id]; sw+=w[a.id]; } }
    else areas.push({a, mean:null, n:0, w:w[a.id]||0});
  });
  const raw = sw? sum/sw : null;
  let cap=15; const notes=[];
  if(o.type==="praktisch"){
    const f=o.ratings.P2, pl=areas.find(x=>x.a.id==="planung");
    const fg=gradeOf(f);
    if((fg&&fg.n>=4) || (pl&&pl.mean!=null&&pl.mean<8)){ cap=10; notes.push("Der Entwurf weist deutliche Mängel auf: Sehr gute Noten sind ausgeschlossen, gute nur im absoluten Ausnahmefall. Der Vorschlag wird auf 10 Punkte begrenzt; im begründeten Ausnahmefall manuell anpassen."); }
    else if(fg&&fg.n===3){ cap=13; notes.push("Der Entwurf erfüllt die formalen Vorgaben nicht vollständig: Eine sehr gute Bewertung ist ausgeschlossen (Vorschlag max. 13 Punkte)."); }
    const nach=o.reflexion&&o.reflexion.keine_nach==="nein";
    if(nach) notes.push("Die Reflexion war überwiegend Nacherzählung – das spricht gegen obere Notenstufen im Bereich Reflexion.");
  }
  const weak=all.filter(x=>gradeOf(x.p).n>=5);
  if(weak.length) notes.push("Mindestens ein Indikator liegt im Bereich mangelhaft/ungenügend ("+weak.map(x=>x.item.name).join(", ")+"). Bei einer Gesamtnote 5 oder 6 das gesonderte Verfahren beachten.");
  let pts = raw==null? null : Math.min(Math.round(raw), cap);
  const capped = raw!=null && Math.round(raw)>cap;
  return {prof, areas, raw, pts, cap, capped, notes, rated, total, all};
}

function sentence(item, p){
  const g=gradeOf(p); const lv=item.levels[g.n-1]||"";
  let s = item.subj? item.subj+" "+lv : lv;
  s=s.charAt(0).toUpperCase()+s.slice(1);
  return s.replace(/\s+/g," ").trim()+".";
}
function buildText(o){
  const r=compute(o); const m=o.meta;
  if(r.pts==null) return "Noch keine Indikatoren bewertet.";
  const g=gradeOf(r.pts);
  const head = (o.type==="praktisch"?(o.variant==="blp"?"Benotete Lehrprobe":"Praktische Prüfung (Prüfungslehrprobe)"):"Mündliche Prüfung")
    + (m.laa?" – "+m.laa:"") + (m.fach?", "+m.fach:"") + (m.klasse?", Klasse "+m.klasse:"") + (m.datum?", "+fmtDate(m.datum):"");
  const L=[head];
  if(m.thema) L.push((o.type==="praktisch"?"Thema der Stunde: ":"Handlungssituation: ")+m.thema);
  if(o.type==="muendlich"){ const f=FELDER.find(f=>f.n==m.feld); if(f) L.push("Handlungsfeld: "+f.name); }
  L.push("");
  L.push("Bewertungsvorschlag: "+r.pts+" Punkte – „"+g.name+"“, eine Leistung, die "+g.txt+".");
  if(r.capped) L.push("(Rechnerisch "+Math.round(r.raw)+" Punkte; begrenzt wegen der Mängel im Entwurf.)");
  L.push("");
  r.areas.forEach(x=>{
    if(x.mean==null) return;
    const ag=gradeOf(x.mean);
    L.push(x.a.name+" (Teilbewertung „"+ag.name+"“, Ø "+x.mean.toFixed(1).replace(".",",")+" Punkte):");
    x.a.items.filter(i=>o.ratings[i.id]!=null).forEach(i=>L.push("– "+sentence(i,o.ratings[i.id])));
    L.push("");
  });
  const sorted=[...r.all].sort((a,b)=>b.p-a.p);
  if(sorted.length>=3 && sorted[0].p!==sorted[sorted.length-1].p){
    const top=sorted.slice(0,2), low=sorted.slice(-2).reverse();
    L.push("Stärken: "+top.map(x=>x.item.name).join("; ")+".");
    L.push("Entwicklungsfelder: "+low.map(x=>x.item.name).join("; ")+".");
    L.push("");
  }
  const strong=sorted.slice(0,2).map(x=>x.item.name).join(" sowie ");
  L.push("Formulierung für die Verkündung:");
  L.push("„Der Prüfungsausschuss hat die Prüfungsleistung mit der Note „"+g.name+"“ ("+r.pts+" Punkte) bewertet. Maßgeblich waren insbesondere "+(strong||"…")+
    (sorted.length>=3?"; Entwicklungspotenzial zeigt sich vor allem bei "+sorted[sorted.length-1].item.name:"")+". Die Begründung wird in der Niederschrift festgehalten.“");
  return L.join("\n");
}

function renderScale(){
  const o=cur(); const r=compute(o);
  const read=document.getElementById("scaleRead"), mk=document.getElementById("marker");
  if(r.pts==null){ read.innerHTML=`<span class="muted small">Noch kein Vorschlag – Indikatoren in „Bewertung“ einstufen</span>`; mk.style.display="none"; return; }
  const g=gradeOf(r.pts);
  read.innerHTML=`<b>${r.pts}</b><span class="small">Punkte</span><span><strong>${g.name}</strong></span>${r.capped?'<span class="small" style="color:var(--warn)">begrenzt</span>':""}`;
  mk.style.display="block"; mk.className="marker"+(r.capped?" cap":"");
  const pos=(Math.min(15,Math.max(0,r.raw==null?r.pts:Math.min(r.raw,r.cap)))+0.5)/16*100;
  mk.style.left=pos+"%";
}

      ${isP?`<label class="f" style="flex-direction:row;align-items:center;gap:8px">Art
        <select data-bind="variant"><option value="stex" ${o.variant==="stex"?"selected":""}>Staatsprüfung (Beurteilung)</option><option value="blp" ${o.variant==="blp"?"selected":""}>Benotete Lehrprobe (Beratung)</option></select></label>`:""}
    </div>
    <div class="fields">
      <label class="f">Lehramtsanwärter/in<input type="text" data-bind="meta.laa" value="${esc(m.laa)}"></label>
      <label class="f">Fach<input type="text" data-bind="meta.fach" value="${esc(m.fach)}"></label>
      ${isP?`<label class="f">Klasse<input type="text" data-bind="meta.klasse" value="${esc(m.klasse)}"></label>`:

      <p class="small muted">Ausschuss: PV, FL1, FL2 und VdS anwesend. Unterausschuss: PV, ein FL und VdS. Die fachbegleitende Lehrkraft hat in der Staatsprüfung kein Notenvorschlagsrecht.</p>

  const log=[...o.log].reverse().map(e=>`<li><time>${fmtTime(e.t)}</time><span class="v ${e.v==="+"?"p":e.v==="-"?"m":"o"}">${e.v==="+"?"+":e.v==="-"?"–":"·"}</span>

  let side="";
  if(isP){
    side=`<section class="panel"><h3>Entwurf prüfen</h3><p>Formale und inhaltliche Vorgaben. Das Ergebnis fließt als Hinweis in die Bewertung ein.</p>

      <label class="f" style="margin-top:10px">Entwurf: + / –<textarea data-bind="entwurfNotiz" placeholder="Stärken und Mängel des Entwurfs">${esc(o.entwurfNotiz||"")}</textarea></label>
      </section>

      <ul class="checks">${REFLEXION_CHECKS.map(([k,t,h])=>triRow("reflexion",k,t,h,o.reflexion[k])).join("")}</ul></section>`;

    const list=[...f.th,...extra];

    side=`<section class="panel"><h3>Theorie-Tracker: ${esc(f.name)}</h3><p>${esc(f.leit)}</p>
      <p class="small muted">Genannte Theorie antippen und die erreichte Stufe wählen: 1 ${STUFEN[0]}, 2 ${STUFEN[1]}, 3 ${STUFEN[2]}, 4 ${STUFEN[3]}.</p>
      <div class="theories">${list.map(([n,k,c])=>{ const st=(o.theories||{})[thKey(n)]||0;
        return `<div class="th"><span><b>${esc(n)}</b>${c?'<span class="tag">eigene</span>':""}<span class="k">${esc(k)}</span></span>
        <span class="stufe" role="group" aria-label="Stufe für ${esc(n)}">${[1,2,3,4].map(s=>`<button data-action="stufe" data-th="${esc(n)}" data-s="${s}" aria-pressed="${st===s}" title="${STUFEN[s-1]}">${s}</button>`).join("")}</span></div>`;}).join("")}</div>
      ${maxSt?`<div class="note info">Höchste beobachtete Stufe: <b>${STUFEN[maxSt-1]}</b>. Orientierung für „theoriegeleitete Betrachtung“ und „Praxisreflexion“: Stufe 4 spricht für den oberen, Stufe 1 für den unteren Bereich – ausschlaggebend bleibt das Leistungsbild.</div>`:""}
      </section>
      <section class="panel"><h3>Impulse für das Prüfungsgespräch</h3><p>Offen fragen, Denkzeit geben, nicht suggestiv lenken.</p>
        <ul class="qlist">${f.imp.concat((S.kb.questions||[]).filter(q=>q.mode==="muendlich").map(q=>q.text)).map(q=>`<li><span>${esc(q)}</span><button class="btn sm" data-action="logQ" data-q="${esc(q)}">Notieren</button></li>`).join("")}</ul></section>`;

      </section>
      <section class="panel">
        <h3>Beobachtung notieren</h3>

        <div class="chips" role="group" aria-label="Stichworte">${tagsHtml}</div>
        <div class="row">
          <span class="val" role="group" aria-label="Wertung">${["+","o","-"].map(v=>`<button data-action="val" data-v="${v}" aria-pressed="${S.val===v}" aria-label="${v==="+"?"positiv":v==="-"?"kritisch":"neutral"}">${v==="+"?"+":v==="-"?"–":"·"}</button>`).join("")}</span>
          <input type="text" id="noteIn" placeholder="${isP?"z. B. Einstieg mit Alltagsbezug, Schüler sofort aktiv":"z. B. verbindet Deci & Ryan schlüssig mit der Gruppenphase"}" style="flex:1;min-width:200px">
          <button class="btn primary" data-action="addLog">Notieren</button>
        </div>
        <ul class="log">${log||'<li style="display:block" class="muted small">Noch keine Notizen.</li>'}</ul>
      </section>
      <section class="panel"><h3>Freie Notizen</h3><textarea data-bind="notes" placeholder="Schwerpunkte, offene Fragen, Absprachen">${esc(o.notes)}</textarea></section>
    </div>

}
function triRow(group,k,t,h,v){
  return `<li class="tri-row"><span>${esc(t)}${h?`<span class="hint">${esc(h)}</span>`:""}</span><span class="tri" role="group" aria-label="${esc(t)}">${["ja","teils","nein"].map(x=>`<button data-action="tri" data-g="${group}" data-k="${k}" data-v="${x}" aria-pressed="${v===x}">${x}</button>`).join("")}</span></li>`;
}
function phaseName(o,id){ const p=PHASES[o.type].find(p=>p.id===id); return p?p.name:"ohne Phase"; }

function viewRate(){
  const o=cur(); const r=compute(o); const w=weightsOf(o.type);
  const tagMap={}; TAGS[o.type].forEach(([l,ind])=>tagMap[l]=ind);
  const areas=r.prof.areas.map(a=>{
    let lastGroup=null;
    const items=a.items.map(i=>{
      const p=o.ratings[i.id]; const g=gradeOf(p);
      const grp = i.group&&i.group!==lastGroup? `<div class="subgroup">${esc(i.group)}</div>`:""; lastGroup=i.group;
      const ev=o.log.filter(e=>e.tag&&tagMap[e.tag]===i.id);
      return grp+`<div class="ind" id="ind-${i.id}">
        <div class="ind-head"><span class="ind-name">${esc(i.name)}</span><span class="ind-pts">${p!=null?p+" P":"–"}</span></div>
        <div class="seg" role="group" aria-label="${esc(i.name)}">${GRADES.map(G=>`<button data-action="rate" data-id="${i.id}" data-g="${G.n}" aria-pressed="${g&&g.n===G.n}" title="${esc(i.levels[G.n-1])}" data-desc="${esc(i.levels[G.n-1])}">${G.n}</button>`).join("")}
          <button class="skip" data-action="rate" data-id="${i.id}" data-g="0" title="nicht bewertet">–</button></div>
        <p class="desc ${p!=null?"on":""}" id="desc-${i.id}">${p!=null?"„"+esc(i.levels[g.n-1])+"“":"Stufe wählen – die Beschreibung aus dem Leistungsbild erscheint hier."}</p>
        ${p!=null?`<div class="fine"><span>Feinjustierung</span><input type="range" min="${g.min}" max="${g.max}" step="1" value="${p}" data-action="fine" data-id="${i.id}" aria-label="Punkte für ${esc(i.name)}"><span>${g.min}–${g.max}</span></div>`:""}
        ${ev.length?`<div class="evid">${ev.map(e=>`<span class="${e.v==="+"?"p":e.v==="-"?"m":""}">${fmtTime(e.t)} ${esc(e.text)}</span>`).join("")}</div>`:""}
      </div>`;
    }).join("");
    const ar=r.areas.find(x=>x.a.id===a.id);
    return `<div class="area"><div class="area-head"><h3>${esc(a.name)}</h3><span class="w">Gewicht ${w[a.id]||0} %${ar&&ar.mean!=null?" – Ø "+ar.mean.toFixed(1).replace(".",",")+" P":""}</span></div>${items}</div>`;
  }).join("");

  const g=r.pts!=null?gradeOf(r.pts):null;
  if(!o.textEdited) o.text=buildText(o);
  const props=o.props;
  return `<div class="grid2">
    <section class="panel">
      <h2>Standardisiertes Leistungsbild – ${esc(r.prof.label)}</h2>
      <p>Stufe je Indikator wählen. Die Punkte werden je Bereich gemittelt und nach den Gewichten verrechnet. ${o.type==="praktisch"?"Unterricht und Reflexion haben Vorrang vor dem Entwurf.":"Zählt: die schlüssige Verbindung von Theorie, Recht, Kommunikation, Lehrerhandeln und eigener Entwicklung."}</p>
      <p class="small muted">${r.rated} von ${r.total} Indikatoren bewertet. Notizen mit passendem Stichwort erscheinen unter dem jeweiligen Indikator.</p>
      ${areas}
    </section>
    <div class="sticky">
      <section class="panel">
        <h3>Bewertungsvorschlag</h3>
        ${g?`<div class="row" style="align-items:flex-end;margin-top:8px"><div class="big">${r.pts}<small> Punkte</small></div><div class="gname" style="color:var(--g${g.n})">${g.name}</div></div>
          <p class="small muted">Rechnerisch ${r.raw.toFixed(2).replace(".",",")} Punkte</p>`:`<p class="muted">Noch keine Einstufung.</p>`}
        <ul class="arealist">${r.areas.map(x=>`<li><span>${esc(x.a.name)} <span class="muted small">(${x.w} %)</span></span><span>${x.mean!=null?x.mean.toFixed(1).replace(".",",")+" P – "+gradeOf(x.mean).name:"–"}</span></li>`).join("")}</ul>
        ${r.notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}
      </section>
      <section class="panel">
        <h3>Notenvorschläge im Ausschuss</h3>
        <p>Reihenfolge als Verfahrenshilfe: zuerst Fachleiter, dann Schule, zuletzt der Vorsitz.</p>
        <div class="props">
          <label for="pfl"><span class="ord">1</span>Fachleiter/in</label><input id="pfl" type="number" min="0" max="15" data-bind="props.fl" value="${esc(props.fl)}" placeholder="P">
          <label for="pvds"><span class="ord">2</span>Schule / VfA</label><input id="pvds" type="number" min="0" max="15" data-bind="props.vds" value="${esc(props.vds)}" placeholder="P">
          <label for="ppv"><span class="ord">3</span>Vorsitz</label><input id="ppv" type="number" min="0" max="15" data-bind="props.pv" value="${esc(props.pv)}" placeholder="${r.pts??"P"}">
          <label for="pfin"><b>Festgesetzt</b></label><input id="pfin" type="number" min="0" max="15" data-bind="props.final" value="${esc(props.final)}" placeholder="P">
        </div>
        <p class="small muted" id="propInfo">${propInfo(o)}</p>
        <div class="row" style="margin-top:8px"><button class="btn sm" data-action="takeProposal" ${r.pts==null?"disabled":""}>Vorschlag als eigenen übernehmen</button></div>
      </section>
    </div>
  </div>
  <section class="panel" style="margin-top:18px">
    <div class="row"><h3>Begründung für die Niederschrift</h3><span class="spacer"></span>
      ${o.textEdited?`<button class="btn sm" data-action="regen">Neu aus Bewertung erzeugen</button>`:""}
      ${S.sample?`<button class="btn sm primary" data-action="aiText">Mit Claude ausformulieren</button>`:""}
      <button class="btn sm" data-action="copyText">Kopieren</button>
      <button class="btn sm" data-action="exportObs">Als Datei speichern</button>
    </div>
    <p>Aus den Formulierungen des Leistungsbilds zusammengesetzt; frei bearbeitbar. Nach einer Bearbeitung wird der Text nicht mehr automatisch überschrieben.</p>
    <textarea id="textOut" data-bind="text" style="min-height:300px">${esc(o.text)}</textarea>
    <p class="small muted" id="aiState"></p>
  </section>`;
}
function propInfo(o){
  const p=o.props; const vals=[p.fl,p.vds,p.pv].filter(v=>v!==""&&v!=null).map(Number);
  if(!vals.length) return "Noch keine Vorschläge eingetragen.";
  const avg=vals.reduce((a,b)=>a+b,0)/vals.length; const spread=Math.max(...vals)-Math.min(...vals);
  let s="Mittel der Vorschläge: "+avg.toFixed(1).replace(".",",")+" P ("+gradeOf(avg).name+").";
  if(spread>=3) s+=" Abweichung von "+spread+" Punkten – Begründungen kriterienbezogen abgleichen.";
  if(p.final!==""&&p.final!=null) s+=" Festgesetzt: "+p.final+" P – „"+gradeOf(Number(p.final)).name+"“.";
  return s;
}

/* ============================================================

   ============================================================ */
function tick(){
  const el=document.getElementById("timer"); if(!el) return;
  const o=cur(); if(!o.phaseAt){ el.textContent="0:00"; el.classList.remove("over"); return; }
  const s=Math.floor((Date.now()-o.phaseAt)/1000); const m=Math.floor(s/60);
  el.textContent=m+":"+String(s%60).padStart(2,"0");
  const p=PHASES[o.type].find(p=>p.id===o.phase);
  el.classList.toggle("over", !!(p&&p.target&&m>=p.target));
}
setInterval(tick,1000);

function toast(t){ const el=document.getElementById("toast"); el.textContent=t; el.classList.add("on"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("on"),1800); }
function setPath(obj,path,val){ const k=path.split("."); let o=obj; for(let i=0;i<k.length-1;i++){ o[k[i]]=o[k[i]]||{}; o=o[k[i]]; } o[k[k.length-1]]=val; }

document.getElementById("curSel").addEventListener("change",e=>{ S.cur=e.target.value; lsSet(); render(); });

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.bind){
    const o=cur(); let v=t.value; if(t.dataset.num) v=Number(v);
    setPath(o,t.dataset.bind,v);
    if(t.dataset.bind==="text") o.textEdited=true;
    touch("obs",o.id);
    if(t.dataset.bind.startsWith("props.")){ const pi=document.getElementById("propInfo"); if(pi) pi.textContent=propInfo(o); }
    if(t.dataset.bind==="meta.laa"||t.dataset.bind==="meta.datum"){ const sel=document.getElementById("curSel"); const op=[...sel.options].find(x=>x.value===o.id); if(op) op.textContent=obsLabel(o); }
  }
  if(t.dataset.wt){ const [ty,a]=t.dataset.wt.split("."); S.kb.weights[ty]=S.kb.weights[ty]||{}; S.kb.weights[ty][a]=Math.max(0,Number(t.value)||0); touch("kb"); renderScale(); }
  if(t.dataset.action==="fine"){ const o=cur(); o.ratings[t.dataset.id]=Number(t.value); touch("obs",o.id);
    const pe=t.closest(".ind").querySelector(".ind-pts"); pe.textContent=t.value+" P"; renderScale(); refreshSide(); }

document.addEventListener("change",e=>{

let _scroll=0; function keepScroll(){ window.scrollTo(0,_scroll); }
function refreshSide(){ /* leichte Aktualisierung des Vorschlags ohne Neuaufbau */

document.addEventListener("mouseover",e=>{

document.addEventListener("mouseout",e=>{

document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="noteIn"){ e.preventDefault(); addLog(); } });

function addLog(text){
  const o=cur(); const inp=document.getElementById("noteIn");
  const t=(text??(inp?inp.value:"")).trim(); if(!t && !S.tag) return;
  o.log.push({id:uid(), t:Date.now(), phase:o.phase, tag:S.tag, v:S.val, text:t||S.tag});
  touch("obs",o.id); S.tag=null; S.val="o";
  render(); const ni=document.getElementById("noteIn"); if(ni) ni.focus();
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("[data-action]"); if(!b) return;
  const a=b.dataset.action; const o=cur();
  if(a==="fine") return;
  _scroll=window.scrollY;
  switch(a){
    case "tab": S.tab=b.dataset.tab; render(); window.scrollTo(0,0); return;
    case "newObs": { const n=newObs(b.dataset.type); const c=cur(); if(c){ ["pv","fl","vds","fbl","fach","laa"].forEach(k=>n.meta[k]=c.meta[k]); }
      S.obs[n.id]=n; S.cur=n.id; touch("obs",n.id); S.tab="beobachtung"; render(); toast(b.dataset.type==="praktisch"?"Neue Lehrprobe angelegt":"Neue mündliche Prüfung angelegt"); return; }
    case "phase": { const same=o.phase===b.dataset.ph; o.phase=same?null:b.dataset.ph; o.phaseAt=same?null:Date.now(); touch("obs",o.id); render(); keepScroll(); return; }
    case "tag": S.tag=S.tag===b.dataset.tag?null:b.dataset.tag; document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.tag===S.tag)); document.getElementById("noteIn")?.focus(); return;
    case "val": S.val=b.dataset.v; document.querySelectorAll(".val button").forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===S.val)); return;
    case "addLog": addLog(); keepScroll(); return;
    case "delLog": o.log=o.log.filter(x=>x.id!==b.dataset.id); touch("obs",o.id); render(); keepScroll(); return;
    case "logQ": o.log.push({id:uid(),t:Date.now(),phase:o.phase,tag:null,v:"o",text:"Frage: "+b.dataset.q}); touch("obs",o.id); toast("Frage notiert"); return;
    case "tri": { const g=b.dataset.g; o[g]=o[g]||{}; o[g][b.dataset.k]=o[g][b.dataset.k]===b.dataset.v?null:b.dataset.v; touch("obs",o.id);
      b.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",o[g][b.dataset.k]===x.dataset.v)); renderScale(); return; }
    case "stufe": { o.theories=o.theories||{}; const n=b.dataset.th, key=thKey(n), s=Number(b.dataset.s); if(o.theories[key]===s) delete o.theories[key]; else o.theories[key]=s;
      const st=STUFEN[s-1]; if(o.theories[key]) o.log.push({id:uid(),t:Date.now(),phase:o.phase,tag:"Theoriebezug",v:"o",text:n+" – Stufe "+s+" ("+st+")"});
      touch("obs",o.id); render(); keepScroll(); return; }
    case "rate": { const g=Number(b.dataset.g); if(g===0) delete o.ratings[b.dataset.id]; else o.ratings[b.dataset.id]=GRADES[g-1].def; touch("obs",o.id); render(); keepScroll(); return; }
    case "takeProposal": { const r=compute(o); o.props.pv=r.pts; touch("obs",o.id); render(); keepScroll(); return; }
    case "regen": o.textEdited=false; o.text=buildText(o); touch("obs",o.id); render(); keepScroll(); return;
    case "copyText": copy(o.text); return;
    case "exportObs": exportObs(o); return;
    case "aiText": aiText(b); return;
    case "abl": S.abl=b.dataset.k; render(); return;
    case "ablDone": { o.ablaufDone=o.ablaufDone||{}; o.ablaufDone[b.dataset.k]=o.ablaufDone[b.dataset.k]||{}; o.ablaufDone[b.dataset.k][b.dataset.i]=b.checked; touch("obs",o.id);
      const li=b.closest(".steps li"); if(li) li.classList.toggle("done",b.checked); return; }
    case "open": S.cur=b.dataset.id; S.tab="beobachtung"; lsSet(); render(); return;
    case "dup": { const src=S.obs[b.dataset.id]; const n=newObs(src.type); n.variant=src.variant; ["pv","fl","vds","fbl","fach","feld"].forEach(k=>n.meta[k]=src.meta[k]); S.obs[n.id]=n; S.cur=n.id; touch("obs",n.id); S.tab="beobachtung"; render(); toast("Neue Beobachtung mit gleichem Ausschuss angelegt"); return; }
    case "delObs": if(confirm("Diese Beobachtung endgültig löschen? Das lässt sich nicht rückgängig machen.")){ delete S.obs[b.dataset.id]; dirty.obs.delete(b.dataset.id); dirty.delObs.add(b.dataset.id); if(S.cur===b.dataset.id) S.cur=Object.keys(S.obs)[0]||null; touch("kb"); render(); toast("Beobachtung gelöscht"); } return;
    case "addDoc": { const title=document.getElementById("docTitle").value.trim()||"Unbenanntes Dokument"; const text=document.getElementById("docText").value.trim(); if(!text){ toast("Bitte Text einfügen oder eine Datei laden"); return; } addDoc(title,text); return; }
    case "pickFile": document.getElementById("fileIn").click(); return;
    case "viewDoc": { const d=S.docs[b.dataset.id]; const v=document.getElementById("docView"); v.innerHTML=`<h3 style="margin-top:12px">${esc(d.title)}</h3><div class="out">${esc(d.text.slice(0,20000))}${d.text.length>20000?"\n…":""}</div>`; return; }
    case "docUse": S.docs[b.dataset.id].use=b.checked; touch("doc",b.dataset.id); return;
    case "delDoc": if(confirm("Dokument aus der Wissensbasis löschen?")){ delete S.docs[b.dataset.id]; dirty.docs.delete(b.dataset.id); dirty.delDocs.add(b.dataset.id); touch("kb"); render(); } return;
    case "aiExtract": aiExtract(b.dataset.id,b); return;
    case "takeExtract": takeExtract(); return;
    case "aiAsk": aiAsk(b); return;
    case "addQ": { const t=document.getElementById("qText").value.trim(); if(!t) return; S.kb.questions.push({id:uid(),mode:document.getElementById("qMode").value,text:t}); touch("kb"); render(); toast("Frage hinzugefügt"); return; }
    case "delQ": S.kb.questions=S.kb.questions.filter(q=>q.id!==b.dataset.id); touch("kb"); render(); return;
    case "addT": { const n=document.getElementById("tName").value.trim(); if(!n) return; S.kb.theories.push({id:uid(),feld:Number(document.getElementById("tFeld").value),name:n,kern:document.getElementById("tKern").value.trim()}); touch("kb"); render(); toast("Theorie hinzugefügt"); return; }
    case "delT": S.kb.theories=S.kb.theories.filter(q=>q.id!==b.dataset.id); touch("kb"); render(); return;

      if(!name||lv.some(x=>!x)){ toast("Bitte Namen und alle sechs Stufen ausfüllen"); return; }
      S.kb.indicators.push({id:"X"+uid(),profile:document.getElementById("iProf").value,area:document.getElementById("iArea").value,name,subj:document.getElementById("iSubj").value.trim()||name,levels:lv}); touch("kb"); render(); toast("Indikator hinzugefügt"); return; }
    case "delI": S.kb.indicators=S.kb.indicators.filter(q=>q.id!==b.dataset.id); touch("kb"); render(); return;
    case "resetW": S.kb.weights=JSON.parse(JSON.stringify(DEFAULT_WEIGHTS)); touch("kb"); render(); return;
    case "exportAll": exportAll(); return;
    case "importAll": document.getElementById("importIn").click(); return;
  }
});

/* ---------- Dokumente laden ---------- */
function addDoc(title,text){
  let t=text; if(t.length>200000){ t=t.slice(0,200000); toast("Dokument auf 200.000 Zeichen gekürzt"); }
  const id=uid(); S.docs[id]={id,title,text:t,added:Date.now(),use:true}; touch("doc",id); render();
  toast("Dokument gespeichert");
}
let pdfjsP=null;
function loadPdfJs(){
  if(pdfjsP) return pdfjsP;
  pdfjsP=new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; res(window.pdfjsLib);}catch(e){rej(e);} };
    s.onerror=()=>rej(new Error("PDF-Bibliothek nicht ladbar")); document.head.appendChild(s); });
  return pdfjsP;
}
document.getElementById("fileIn").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  const st=document.getElementById("fileState"); if(st) st.textContent="Lese "+f.name+" …";
  try{
    let text="";
    if(/\.pdf$/i.test(f.name)){
      const lib=await loadPdfJs(); const pdf=await lib.getDocument({data:await f.arrayBuffer()}).promise;
      for(let p=1;p<=pdf.numPages;p++){ const pg=await pdf.getPage(p); const c=await pg.getTextContent(); text+=c.items.map(i=>i.str+(i.hasEOL?"\n":" ")).join("")+"\n\n"; }
    } else text=await f.text();
    if(!text.trim()) throw new Error("Kein Text gefunden");
    addDoc(f.name.replace(/\.[^.]+$/,""), text.trim());
  }catch(err){ if(st) st.textContent="Datei konnte nicht gelesen werden ("+err.message+"). Text bitte kopieren und einfügen."; }
});
document.getElementById("importIn").addEventListener("change",async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(d.kb){ const k=d.kb; ["questions","theories","indicators"].forEach(key=>{ (k[key]||[]).forEach(x=>{ if(!S.kb[key].find(y=>y.id===x.id)) S.kb[key].push(x); }); }); if(k.weights) S.kb.weights=k.weights; touch("kb"); }
    Object.values(d.obs||{}).forEach(o=>{ S.obs[o.id]=o; touch("obs",o.id); });
    Object.values(d.docs||{}).forEach(x=>{ S.docs[x.id]=x; touch("doc",x.id); });
    render(); toast("Import abgeschlossen");
  }catch(err){ toast("Import fehlgeschlagen: keine gültige Exportdatei"); }
});

/* ---------- Export ---------- */
async function saveFile(name,data){
  if(S.downloads){ try{ await S.downloads.save({filename:name,data}); toast("Datei gespeichert"); return; }catch(e){ if(e&&e.code==="declined") return; } }
  try{
    const type=/\.json$/.test(name)?"application/json":"text/markdown";
    const url=URL.createObjectURL(new Blob([data],{type:type+";charset=utf-8"}));
    const a=document.createElement("a"); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000); toast("Datei gespeichert");
  }catch(e){ copy(data); toast("Speichern nicht möglich – Inhalt in die Zwischenablage kopiert"); }
}
function copy(t){ if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>toast("Kopiert"),()=>fallbackCopy(t)); else fallbackCopy(t); }
function fallbackCopy(t){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy"); toast("Kopiert");}catch(e){} ta.remove(); }
function exportObs(o){
  const r=compute(o);
  const L=["# "+obsLabel(o),"",o.text,"","## Beobachtungsprotokoll"];
  o.log.forEach(e=>L.push("- "+fmtTime(e.t)+" ["+phaseName(o,e.phase)+(e.tag?" / "+e.tag:"")+"] "+(e.v==="+"?"(+) ":e.v==="-"?"(–) ":"")+e.text));
  if(o.type==="praktisch"){
    L.push("","## Entwurf"); ENTWURF_CHECKS.forEach(([k,t])=>o.entwurf[k]&&L.push("- "+t+": "+o.entwurf[k])); if(o.entwurfNotiz) L.push("", o.entwurfNotiz);
    L.push("","## Reflexion"); REFLEXION_CHECKS.forEach(([k,t])=>o.reflexion[k]&&L.push("- "+t+": "+o.reflexion[k]));
  } else { L.push("","## Theoriebezüge"); Object.entries(o.theories||{}).forEach(([n,s])=>L.push("- "+n+": Stufe "+s+" ("+STUFEN[s-1]+")")); }
  L.push("","## Notenvorschläge","- Fachleiter/in: "+(o.props.fl||"–"),"- Schule/VfA: "+(o.props.vds||"–"),"- Vorsitz: "+(o.props.pv||"–"),"- Festgesetzt: "+(o.props.final||"–"),"- Rechnerischer Vorschlag: "+(r.pts??"–"));
  if(o.notes) L.push("","## Notizen",o.notes);
  saveFile(("Niederschrift_"+(o.meta.laa||"LAA")+"_"+o.meta.datum).replace(/[^\wäöüÄÖÜß.-]+/g,"_")+".md", L.join("\n"));
}
function exportAll(){ saveFile("Pruefungsbegleiter_Export_"+today()+".json", JSON.stringify({version:1,kb:S.kb,obs:S.obs,docs:S.docs},null,2)); }

/* ---------- Claude ---------- */
function aiErr(e){ const c=e&&e.code; return c==="not_granted"?"Claude wurde für diese Seite nicht freigegeben.":c==="rate_limited"?"Gerade zu viele Anfragen – bitte kurz warten.":"Claude ist gerade nicht erreichbar."; }
function kbContext(limit){
  let s=""; Object.values(S.docs).filter(d=>d.use).forEach(d=>{ if(s.length<limit) s+="\n### "+d.title+"\n"+d.text.slice(0,limit-s.length); });
  return s;
}
async function aiText(btn){
  const o=cur(); const r=compute(o); if(r.pts==null){ toast("Zuerst Indikatoren einstufen"); return; }
  const g=gradeOf(r.pts); const st=document.getElementById("aiState"); btn.disabled=true; st.textContent="Claude formuliert …";
  const logTxt=o.log.map(e=>"- ["+phaseName(o,e.phase)+(e.tag?"/"+e.tag:"")+"] "+(e.v==="+"?"(+) ":e.v==="-"?"(–) ":"")+e.text).join("\n");
  const extra = o.type==="praktisch"
    ? "Entwurfsprüfung: "+ENTWURF_CHECKS.filter(([k])=>o.entwurf[k]).map(([k,t])=>t+": "+o.entwurf[k]).join("; ")+"\nEntwurf +/-: "+(o.entwurfNotiz||"")+"\nReflexion: "+REFLEXION_CHECKS.filter(([k])=>o.reflexion[k]).map(([k,t])=>t+": "+o.reflexion[k]).join("; ")
    : "Theoriebezüge: "+Object.entries(o.theories||{}).map(([n,s])=>n+" (Stufe "+STUFEN[s-1]+")").join("; ");
  const prompt=`Du unterstützt einen Prüfungsvorsitz im Thüringer Vorbereitungsdienst. Formuliere eine sachliche, niederschrifttaugliche Begründung auf Deutsch (ca. 180–280 Wörter) für die folgende ${o.type==="praktisch"?(o.variant==="blp"?"benotete Lehrprobe":"praktische Staatsprüfung"):"mündliche Staatsprüfung"}.
Regeln:
- Die Note steht fest: ${r.pts} Punkte, „${g.name}“. Verändere sie nicht und schlage keine andere vor.
- Gliedere nach den Bereichen ${r.prof.areas.map(a=>a.name).join(", ")}, jeweils als kurzer Fließtextabsatz.
- Nutze die Formulierungen des standardisierten Leistungsbilds und wertende Adjektive passend zur jeweiligen Teilstufe. Adjektive je Stufe: 1: ${ADJ[1]} | 2: ${ADJ[2]} | 3: ${ADJ[3]} | 4: ${ADJ[4]} | 5: ${ADJ[5]} | 6: ${ADJ[6]}.
- Stütze dich nur auf die Einstufungen und Beobachtungsnotizen unten; erfinde keine Beobachtungen. Konkrete Notizen als Belege einbauen.
- Bewertet wird nur die gezeigte Prüfungsleistung. Kein Beratungston, keine Anrede, keine Überschriften mit Markdown-Zeichen.
- Schließe mit einem Satz, der die maßgeblichen Gründe für die Note zusammenfasst.

Einstufungen (aus dem Leistungsbild):
${r.all.map(x=>"- ["+x.area.name+"] "+x.item.name+": "+x.p+" P – "+sentence(x.item,x.p)).join("\n")}

Beobachtungsnotizen:
${logTxt||"(keine)"}
${extra}
Freie Notizen: ${o.notes||"(keine)"}
${kbContext(12000)?"\nZusätzliche Hinweise aus den Unterlagen des Vorsitzes (nur zur Orientierung):"+kbContext(12000):""}`;
  try{
    const ta=document.getElementById("textOut");
    const res=await S.sample(prompt,{modelTier:"default",onText:({text})=>{ if(ta) ta.value=text; }});
    o.text=res.text; o.textEdited=true; touch("obs",o.id); st.textContent="Von Claude ausformuliert – bitte prüfen und bei Bedarf anpassen.";
  }catch(e){ st.textContent=aiErr(e); if(e&&e.text){ o.text=e.text; o.textEdited=true; touch("obs",o.id);} }
  btn.disabled=false;
}
let lastExtract=null;
async function aiExtract(id,btn){
  const d=S.docs[id]; const out=document.getElementById("extractOut"); btn.disabled=true;
  out.innerHTML=`<p class="muted small">Claude wertet „${esc(d.title)}“ aus …</p>`;
  const prompt=`Werte das folgende Dokument für ein Werkzeug zur Abnahme von Lehrproben und Staatsprüfungen (Thüringer Vorbereitungsdienst) aus. Extrahiere nur, was tatsächlich im Dokument steht.
Antworte ausschließlich mit JSON in dieser Form:
{"fragen":[{"modus":"stex"|"blp"|"muendlich","text":"…"}],
 "theorien":[{"feld":1-11,"name":"…","kern":"…"}],
 "kriterien":[{"profil":"praktisch"|"muendlich","bereich":"${PROFILES.praktisch.areas.map(a=>a.id).join("|")}|${PROFILES.muendlich.areas.map(a=>a.id).join("|")}","name":"…","satzanfang":"…","stufen":["Stufe 1 sehr gut","2","3","4","5","6 ungenügend"]}],
 "hinweise":["kurze, für den Vorsitz relevante Verfahrenshinweise"]}
Handlungsfelder: ${FELDER.map(f=>f.n+"="+f.name).join(", ")}. Kriterien nur aufnehmen, wenn sechs Stufen ableitbar sind. Höchstens je 12 Einträge.

Dokument „${d.title}“:
${d.text.slice(0,40000)}`;
  try{
    const j=await S.sample.json(prompt,{modelTier:"default"});
    lastExtract={fragen:j.fragen||[],theorien:j.theorien||[],kriterien:(j.kriterien||[]).filter(k=>Array.isArray(k.stufen)&&k.stufen.length===6),hinweise:j.hinweise||[]};
    const L=lastExtract; let i=0;
    const box=(kind,idx,label)=>`<li><label><input type="checkbox" checked data-ex="${kind}:${idx}"><span>${label}</span></label></li>`;
    out.innerHTML=`<h3 style="margin-top:14px">Vorschläge aus „${esc(d.title)}“</h3>
      ${L.hinweise.length?`<div class="note info">${L.hinweise.map(esc).join("<br>")}</div>`:""}
      <ul class="checks">${L.fragen.map((q,k)=>box("f",k,esc(q.text)+` <span class="tag">${esc(q.modus)}</span>`)).join("")}
      ${L.theorien.map((t,k)=>box("t",k,"<b>"+esc(t.name)+"</b> – "+esc(t.kern)+` <span class="tag">Feld ${esc(t.feld)}</span>`)).join("")}
      ${L.kriterien.map((c,k)=>box("k",k,"Indikator: <b>"+esc(c.name)+"</b>"+` <span class="tag">${esc(c.profil)} / ${esc(c.bereich)}</span>`)).join("")}</ul>
      ${(L.fragen.length+L.theorien.length+L.kriterien.length)?`<div class="row" style="margin-top:8px"><button class="btn primary" data-action="takeExtract">Ausgewählte übernehmen</button></div>`:`<p class="muted small">Keine übertragbaren Fragen, Theorien oder Kriterien gefunden.</p>`}`;
  }catch(e){ out.innerHTML=`<p class="small" style="color:var(--bad)">${aiErr(e)}</p>`; }
  btn.disabled=false;
}
function takeExtract(){
  if(!lastExtract) return; let n=0;
  document.querySelectorAll("[data-ex]").forEach(c=>{ if(!c.checked) return; const [k,i]=c.dataset.ex.split(":"); const L=lastExtract;
    if(k==="f"){ const q=L.fragen[i]; S.kb.questions.push({id:uid(),mode:["stex","blp","muendlich"].includes(q.modus)?q.modus:"stex",text:q.text}); n++; }
    if(k==="t"){ const t=L.theorien[i]; S.kb.theories.push({id:uid(),feld:Math.min(11,Math.max(1,Number(t.feld)||1)),name:t.name,kern:t.kern||""}); n++; }
    if(k==="k"){ const x=L.kriterien[i]; const prof=x.profil==="muendlich"?"muendlich":"praktisch"; const area=PROFILES[prof].areas.find(a=>a.id===x.bereich)?x.bereich:PROFILES[prof].areas[0].id;
      S.kb.indicators.push({id:"X"+uid(),profile:prof,area,name:x.name,subj:x.satzanfang||x.name,levels:x.stufen.map(String)}); n++; }
  });
  touch("kb"); lastExtract=null; render(); toast(n+" Einträge übernommen");
}
async function aiAsk(btn){
  const q=document.getElementById("askIn").value.trim(); if(!q) return; const out=document.getElementById("askOut");
  out.style.display="block"; out.textContent="Claude denkt nach …"; btn.disabled=true;
  const base=`Grundlagen (Kurzfassung): ${ABLAUF.stex.title}: ${ABLAUF.stex.pre.concat(ABLAUF.stex.steps).join("; ")}. ${ABLAUF.blp.title}: ${ABLAUF.blp.pre.concat(ABLAUF.blp.steps).join("; ")}. ${ABLAUF.muendlich.title}: ${ABLAUF.muendlich.pre.concat(ABLAUF.muendlich.steps).join("; ")}. Entwurf: ${ENTWURF_CHECKS.map(c=>c[1]).join("; ")}. Notenvorschläge: Fachleiter, dann Schule/VfA (eine Stimme), dann Vorsitz; fbL in STEX nur beratend. Krankmeldung: STEX 10, BLP 5 Arbeitstage vorher nicht dienstunfähig. Wenn der Entwurf deutliche Mängel aufweist, sind sehr gute Noten ausgeschlossen und gute nur im absoluten Ausnahmefall.`;
  const prompt=`Beantworte die Frage eines Prüfungsvorsitzes knapp und sachlich auf Deutsch, nur auf Grundlage der Unterlagen unten. Wenn die Unterlagen keine Antwort enthalten, sage das deutlich und rate nicht. Nenne, aus welcher Unterlage die Antwort stammt.

${base}
${kbContext(30000)}

Frage: ${q}`;
  try{ await S.sample(prompt,{modelTier:"default",onText:({text})=>{ out.textContent=text; }}); }
  catch(e){ out.textContent=aiErr(e); }
  btn.disabled=false;
}

(function boot(){
  const d=lsGet();
  if(d){ S.kb=Object.assign(defaultKB(), d.kb||{}); S.obs=d.obs||{}; S.docs=d.docs||{}; S.cur=d.cur; S.store="lokal im Browser"; }
  else S.store="lokal im Browser";
  ensureCur(); render(); initCaps();
})();
</script>
